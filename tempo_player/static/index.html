<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tempo player</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23e8a25a'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%2315110e'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #15110e;
    --panel: #201914;
    --panel-2: #2a211b;
    --border: #3b2f27;
    --text: #f2e7d8;
    --muted: #9a887a;
    --accent: #e8a25a;
    --accent-hover: #f3b877;
    --accent-dim: #b8763c;
    --terracotta: #d0694c;
    --gold: #e9c46f;
    --wave-idle: #4a3a2f;
    --error: #e07a6a;
    color-scheme: dark;
    accent-color: var(--accent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
    padding: 20px 16px 28px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--bg); }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  * { scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; white-space: nowrap; }
  button:disabled { cursor: default; opacity: .55; }
  h2 { font-size: 15px; font-weight: 650; margin: 0; }

  .layout { max-width: 780px; margin: 0 auto; }
  @media (min-width: 1180px) {
    .layout { max-width: 1200px; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 16px; align-items: start; }
    .side { position: sticky; top: 20px; margin-top: 62px; }
    .side .hlist { max-height: calc(100vh - 150px); }
  }

  header { display: flex; align-items: center; gap: 8px; padding: 0 6px 14px; }
  .logo { font-size: 28px; font-weight: 700; letter-spacing: -.5px; margin-right: auto; }
  .logo span { color: var(--accent); }
  .ghost { color: var(--muted); font-size: 13px; padding: 9px 14px; border-radius: 12px; }
  .ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  .ghost.small { font-size: 12px; padding: 5px 10px; border-radius: 9px; }
  .soft { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 9px 16px; font-size: 13px; }
  .soft:hover { background: var(--border); }
  .primary { background: var(--accent); color: var(--bg); font-weight: 600; border-radius: 12px; padding: 0 22px; height: 42px; }
  .primary:hover:not(:disabled) { background: var(--accent-hover); }

  .card { background: var(--panel); border-radius: 18px; padding: 16px 18px; margin-bottom: 12px; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-head h2 { margin-right: auto; }
  .count { color: var(--muted); font-weight: 400; margin-left: 4px; }

  form.src { display: flex; gap: 10px; }
  form.src input {
    flex: 1; min-width: 0; height: 42px; border-radius: 12px; padding: 0 14px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font: inherit; caret-color: var(--accent);
  }
  form.src input::placeholder { color: var(--muted); }
  form.src input:focus { border-color: var(--accent-dim); }

  .now { display: flex; align-items: center; gap: 14px; }
  .play { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); flex: none;
          display: grid; place-items: center; transition: background .15s, transform .1s; }
  .play:hover { background: var(--accent-hover); }
  .play:active { transform: scale(.96); }
  .play svg { width: 22px; height: 22px; fill: var(--bg); }
  .loop { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px 0 11px;
          border-radius: 19px; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
          font-size: 13px; transition: background .15s, color .15s, border-color .15s; }
  .loop:hover { color: var(--text); background: var(--border); }
  .loop svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
              stroke-linecap: round; stroke-linejoin: round; }
  .loop.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .loop.on:hover { background: var(--accent-hover); }
  .meta { min-width: 0; }
  .title { font-size: 17px; font-weight: 650; }
  .author { font-size: 12.5px; color: var(--accent); font-weight: 600; min-height: 0; }
  .meta { flex: 1; }

  /* длинный текст: обрезан с затуханием, при наведении плавно прокручивается */
  .mq { overflow: hidden; white-space: nowrap; }
  .mq > span { display: inline-block; padding-right: 2px; }
  .mq.cut { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
            mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
  .mq.run { -webkit-mask-image: none; mask-image: none; }
  .mq.run > span { animation: mq var(--dur, 6s) ease-in-out infinite alternate; }
  @keyframes mq { 0%, 12% { transform: translateX(0); } 88%, 100% { transform: translateX(var(--shift, 0)); } }
  .status { color: var(--muted); font-size: 12.5px; min-height: 18px; }
  .status.error { color: var(--error); }
  canvas#spec { display: block; width: 100%; height: 76px; margin-top: 14px; }
  .lang { display: inline-flex; background: var(--panel-2); border-radius: 10px; padding: 2px; gap: 2px; margin-right: 4px; }
  .lang button { font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 8px; color: var(--muted); letter-spacing: .3px; }
  .lang button:hover { color: var(--text); }
  .lang button.on { background: var(--border); color: var(--text); }
  canvas#wave { display: block; width: 100%; height: 88px; margin-top: 14px; cursor: pointer; touch-action: none; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; padding: 2px 2px 0; font-variant-numeric: tabular-nums; }

  .speed { text-align: center; padding: 18px 26px 20px; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 14px; padding: 3px; gap: 3px; }
  .seg button { padding: 7px 0; width: 140px; border-radius: 11px; font-size: 13px; }
  .seg button:hover { background: var(--border); }
  .seg button.on { background: var(--accent); color: var(--bg); font-weight: 600; }
  .value { font-size: 56px; font-weight: 700; letter-spacing: -1px; margin: 10px 0 0; line-height: 1.15;
           font-variant-numeric: tabular-nums; color: var(--accent); transition: color .2s; }
  .value.slow { color: var(--terracotta); }
  .value.fast { color: var(--gold); }
  .caption { color: var(--muted); font-size: 13px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; cursor: pointer; margin: 14px 0 0; --p: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(to right, var(--accent-dim) var(--p), var(--border) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; margin-top: -7px; background: var(--accent); box-shadow: 0 0 0 5px rgba(232, 162, 90, .14); transition: box-shadow .15s; }
  input[type=range]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 7px rgba(232, 162, 90, .2); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--border); }
  input[type=range]::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--accent-dim); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgba(232, 162, 90, .14); }
  input[type=range].thin { height: 18px; margin: 2px 0 6px; }
  input[type=range].thin::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; }
  input[type=range].thin::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -5px; box-shadow: 0 0 0 4px rgba(232, 162, 90, .12); }
  input[type=range].thin::-moz-range-track, input[type=range].thin::-moz-range-progress { height: 6px; }
  input[type=range].thin::-moz-range-thumb { width: 16px; height: 16px; }
  .range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; }

  .presets { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
  .chip { min-width: 64px; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; background: var(--panel-2); border: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .chip:hover { background: var(--border); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }

  /* --- эффекты */
  .fx-presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .fx-presets .chip { min-width: 0; }
  .fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fx-tile { background: var(--panel-2); border: 1px solid transparent; border-radius: 14px; padding: 12px 14px 8px; transition: border-color .2s; }
  .fx-tile.on { border-color: rgba(232, 162, 90, .35); }
  .fx-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .fx-name { font-weight: 650; font-size: 14px; }
  .fx-tile.on .fx-name { color: var(--accent); }
  .fx-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .fx-row output { color: var(--text); font-variant-numeric: tabular-nums; }
  .fx-tile:not(.on) .fx-row, .fx-tile:not(.on) input[type=range] { opacity: .45; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 11px; background: var(--border); transition: background .2s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .switch input:checked + span { background: var(--accent-dim); }
  .switch input:checked + span::after { transform: translateX(16px); background: var(--text); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- история */
  .hlist { max-height: 380px; overflow-y: auto; margin: 0 -8px; padding: 0 4px; }
  .hempty { color: var(--muted); font-size: 13px; padding: 6px 4px 10px; }
  .hrow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; cursor: pointer; }
  .hrow:hover { background: var(--panel-2); }
  .hicon { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; transition: background .15s; }
  .hrow:hover .hicon { background: var(--accent); }
  .hicon svg { width: 13px; height: 13px; fill: var(--muted); }
  .hrow:hover .hicon svg { fill: var(--bg); }
  .hmeta { min-width: 0; flex: 1; }
  .hauthor { font-size: 12px; color: var(--muted); font-weight: 600; }
  .htitle { font-size: 13.5px; line-height: 1.3; }
  .hrow.current .hauthor { color: var(--accent-dim); }
  .hsub { font-size: 11.5px; color: var(--muted); }
  .hsub .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-dim); margin: 0 4px 1px 0; vertical-align: middle; }
  .hrow.current .htitle { color: var(--accent); font-weight: 600; }
  .hrow.current .hicon { background: var(--accent); }
  .hrow.current .hicon svg { fill: var(--bg); }
  .hdel { width: 26px; height: 26px; border-radius: 8px; color: var(--muted); font-size: 18px; line-height: 1; opacity: 0; flex: none; }
  .hrow:hover .hdel { opacity: 1; }
  .hdel:hover { background: var(--border); color: var(--text); }
  .eq { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
  .eq i { width: 3px; background: var(--bg); border-radius: 1px; animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  .eq.paused i { animation-play-state: paused; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }

  footer { display: flex; align-items: center; gap: 14px; padding: 4px 6px; color: var(--muted); font-size: 12px; }
  footer .keys { margin-right: auto; }
  footer .vol { display: flex; align-items: center; gap: 10px; }
  footer .vol input { width: 170px; margin: 0; }
  footer .vol output { width: 34px; color: var(--text); font-variant-numeric: tabular-nums; }
  kbd { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }

  .overlay { position: fixed; inset: 0; display: none; place-items: center; z-index: 10; background: rgba(21, 17, 14, .86); backdrop-filter: blur(3px); }
  .overlay.show { display: grid; }
  .overlay .box { border: 2px dashed var(--accent); border-radius: 24px; padding: 48px 64px; text-align: center; font-size: 20px; font-weight: 600; }
  .overlay .box small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 6px; }
  .overlay.off .box { border-color: var(--border); }

  @media (max-width: 640px) {
    .seg button { width: auto; padding: 7px 12px; }
    .value { font-size: 44px; }
    .logo { font-size: 24px; }
    header .ghost { padding: 9px 8px; }
    .fx-grid { grid-template-columns: 1fr; }
    .card-head { flex-wrap: wrap; }
    footer { flex-wrap: wrap; }
    footer .keys { display: none; }
    footer .vol { margin-right: auto; }
    .hdel { opacity: 1; }
  }
</style>
</head>
<body>
<div class="layout">
  <main>
    <header>
      <div class="logo">tempo<span>player</span></div>
      <div class="lang" id="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
      <button class="soft" id="open" data-i18n="open"></button>
      <input type="file" id="file" accept="audio/*,video/*,.mp3,.wav,.flac,.ogg,.m4a,.opus,.webm,.aac" hidden>
    </header>

    <div class="card">
      <form class="src" id="src">
        <input id="url" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="url_ph">
        <button class="primary" id="go" type="submit"></button>
      </form>
    </div>

    <div class="card">
      <div class="now">
        <button class="play" id="play" aria-label="Play / Pause"><svg viewBox="0 0 24 24" id="icon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <div class="meta">
          <div class="author mq" id="author"><span></span></div>
          <div class="title mq" id="title"><span></span></div>
          <div class="status" id="status"></div>
        </div>
        <button class="loop" id="loop" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/><path d="M11.5 10l1.5-1v6"/></svg>
          <span id="loopText"></span>
        </button>
      </div>
      <canvas id="spec"></canvas>
      <canvas id="wave"></canvas>
      <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>

    <div class="card speed">
      <div class="seg" id="modes">
        <button data-mode="vinyl" data-i18n="mode_vinyl"></button>
        <button data-mode="tempo" data-i18n="mode_tempo"></button>
        <button data-mode="pitch" data-i18n="mode_pitch"></button>
      </div>
      <div class="value" id="value">1.00×</div>
      <div class="caption" id="caption"></div>
      <input type="range" id="slider">
      <div class="range-labels"><span id="rmin"></span><span id="rmax"></span></div>
      <div class="presets" id="presets"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 data-i18n="fx_title"></h2>
        <div class="fx-presets">
          <button class="chip" data-fxp="slowed">Slowed + Reverb</button>
          <button class="chip" data-fxp="lofi">Lo-fi</button>
          <button class="chip" data-fxp="off" data-i18n="fxp_off"></button>
        </div>
      </div>
      <div class="fx-grid" id="fxgrid"></div>
    </div>

    <footer>
      <div class="keys" data-i18n-html="keys"></div>
      <div class="vol"><span data-i18n="volume"></span> <input type="range" id="vol" class="thin" min="0" max="1" step="0.01"><output id="volv"></output></div>
      <button class="ghost" id="quit" data-i18n="quit"></button>
    </footer>
  </main>

  <aside class="side">
    <div class="card">
      <div class="card-head">
        <h2><span data-i18n="recent"></span><span class="count" id="hcount"></span></h2>
        <button class="ghost small" id="hclear" data-i18n="clear" hidden></button>
      </div>
      <div class="hlist" id="hlist"></div>
    </div>
  </aside>
</div>

<div class="overlay" id="drop"><div class="box"><span data-i18n="drop"></span><small>mp3, wav, flac, ogg, m4a…</small></div></div>
<div class="overlay off" id="offline"><div class="box"><span data-i18n="off_title"></span><small data-i18n="off_sub"></small></div></div>

<script>

  const n = 56, gap = 3, bw = Math.max(2, (w - gap * (n - 1)) / n);
  const css = getComputedStyle(document.documentElement);
  const grad = sctx.createLinearGradient(0, 0, w, 0);
  grad.addColorStop(0, css.getPropertyValue('--terracotta'));
  grad.addColorStop(0.5, css.getPropertyValue('--accent'));
  grad.addColorStop(1, css.getPropertyValue('--gold'));
  for (let i = 0; i < n; i++) {
    const target = specTarget[i] || 0, cur = specShown[i] || 0;
    const v = target > cur ? cur + (target - cur) * 0.55 : cur - Math.max(0.012, (cur - target) * 0.14);  // быстро вверх, плавно вниз
    specShown[i] = Math.max(0, v);
    specPeak[i] = Math.max(specShown[i], (specPeak[i] || 0) - 0.006);
    const x = i * (bw + gap), bh = Math.max(2, specShown[i] * (h - 6));
    sctx.fillStyle = grad;
    sctx.globalAlpha = specShown[i] > 0.01 ? 1 : 0.35;
    sctx.beginPath(); sctx.roundRect(x, h - bh, bw, bh, Math.min(2, bw / 2)); sctx.fill();
    if (specPeak[i] > 0.03) {
      sctx.globalAlpha = 0.55; sctx.fillStyle = css.getPropertyValue('--text');
      sctx.fillRect(x, h - 4 - specPeak[i] * (h - 6), bw, 2);
    }
  }
  sctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- загрузка
async function upload(file) {
  if (!file) return;
  $('#status').textContent = t('uploading');
  try { await api('/api/upload', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(file.name) }, body: file }); }
  catch (e) { /* статус покажет poll */ }
}
function loadUrl(url) { url = (url || '').trim(); if (url) post('/api/url', { url }).catch(() => {}); }

$('#open').onclick = () => $('#file').click();
$('#file').onchange = (e) => { upload(e.target.files[0]); e.target.value = ''; };
$('#src').onsubmit = (e) => { e.preventDefault(); loadUrl($('#url').value); $('#url').blur(); };
$('#quit').onclick = () => { act('quit'); setTimeout(() => $('#offline').classList.add('show'), 300); };
$('#play').onclick = toggle;
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('#slider').addEventListener('input', (e) => setValue(parseFloat(e.target.value)));
$('#vol').addEventListener('input', (e) => setVolume(parseFloat(e.target.value)));

let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', (e) => { if (hasFiles(e)) { dragDepth++; $('#drop').classList.add('show'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('show'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('show');
  if (e.dataTransfer.files.length) upload(e.dataTransfer.files[0]);
  else loadUrl(e.dataTransfer.getData('text'));
});
addEventListener('paste', (e) => {
  if (e.target.matches('input[type=text]')) return;
  const t = e.clipboardData.getData('text');
  if (/^(https?:\/\/|www\.|youtu)/i.test(t.trim())) { $('#url').value = t.trim(); loadUrl(t); }
});
addEventListener('keydown', (e) => {
  const tg = e.target instanceof Element ? e.target : document.body;
  if (tg.matches('input[type=text]') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (tg.matches('input.thin') && e.key.startsWith('Arrow')) return;   // стрелки двигают ползунок эффекта
  const map = {
    ' ': toggle,
    ArrowLeft: () => nudge(-1), ArrowRight: () => nudge(1),
    ArrowUp: () => setVolume(ui.volPos + 0.05), ArrowDown: () => setVolume(ui.volPos - 0.05),
    '0': () => setValue(ui.mode === 'pitch' ? 0 : 1),
    '1': () => setMode('vinyl'), '2': () => setMode('tempo'), '3': () => setMode('pitch'),
  };
  if (map[e.key]) { e.preventDefault(); map[e.key](); }
});

document.querySelectorAll('#lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
applyLang();
poll();
specLoop();
requestAnimationFrame(draw);
</script>
